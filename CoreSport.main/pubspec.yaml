name: coresport
description: "CoreSport - Gestión de Torneos Deportivos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Almacenamiento y utilidades
  shared_preferences: ^2.3.2
  http: ^1.2.2
  image_picker: ^1.1.2

  # UI
  cupertino_icons: ^1.0.8

  # VENTANA (para forzar foco en Windows)
  window_manager: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true